name: Build wheels

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "The runner to use for the build"
        required: true
        type: string
        default: windows-2022
      python-version:
        description: "The Python version to use for the build"
        required: true
        type: string
        default: "3.12"
      cuda-version:
        description: "The CUDA version to use for the build"
        required: true
        type: string
        default: "12.8.0"
      cuda-archs:
        description: "CUDA families: 80=Ampere/Ada, 90=Hopper, 100=datacenter Blackwell, 110=Thor, 120=consumer Blackwell; separate multiple values with semicolons"
        required: true
        type: string
        default: "80"
      torch-version:
        description: "The PyTorch version to use for the build"
        required: true
        type: string
        default: "2.11.0"
      torch-pre:
        description: "Use PyTorch pre-release / nightly index (auto-enabled for 2.11+ or dev)"
        required: false
        type: boolean
        default: false
      head-dims:
        description: "Head dimensions to compile ('64,128', '64,128,256', or 'all')"
        required: false
        type: string
        default: "64,128"
      disable-alibi:
        description: "Disable ALiBi attention bias templates (speeds up build; not used by LLaMA/Qwen)"
        required: false
        type: boolean
        default: false
      disable-dropout:
        description: "Disable attention dropout templates (speeds up build and reduces register usage)"
        required: false
        type: boolean
        default: false
      disable-softcap:
        description: "Disable attention softcap templates (speeds up build; only Gemma-2 uses softcap)"
        required: false
        type: boolean
        default: false
      disable-local:
        description: "Disable local / sliding window attention templates (speeds up build)"
        required: false
        type: boolean
        default: false
      cxx11_abi:
        description: "Enable torch flag C++11 ABI (TRUE/FALSE)"
        required: true
        type: string
        default: "TRUE"
      upload-to-release:
        description: "Upload wheel to this release"
        required: false
        type: boolean
        default: false
      release-version:
        description: "Upload wheel to this release"
        required: false
        type: string

jobs:
  build-wheels:
    uses: ./.github/workflows/_build.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      python-version: ${{ inputs.python-version }}
      cuda-version: ${{ inputs.cuda-version }}
      cuda-archs: ${{ inputs.cuda-archs }}
      torch-version: ${{ inputs.torch-version }}
      torch-pre: ${{ inputs.torch-pre }}
      head-dims: ${{ inputs.head-dims }}
      disable-alibi: ${{ inputs.disable-alibi }}
      disable-dropout: ${{ inputs.disable-dropout }}
      disable-softcap: ${{ inputs.disable-softcap }}
      disable-local: ${{ inputs.disable-local }}
      cxx11_abi: ${{ inputs.cxx11_abi }}
      upload-to-release: ${{ inputs.upload-to-release }}
      release-version: ${{ inputs.release-version }}
